; ============================================================================
;  PeekESP - physical dashboard on an ESP32
; ============================================================================
;
;   pio run                          every panel
;   pio run -e ttgo-t-display        the default board
;   pio run -e gc9a01-round -t upload
;
; One environment per panel, because TFT_eSPI selects its driver, its pins and
; its geometry with #defines. One image drives one panel; there is no runtime
; switch and no way to build a universal binary. See PeekESP/panel_profiles.h.
;
; Only ttgo-t-display has ever run on hardware. The rest compile, their
; geometry is checked, and that is the whole of the claim - flash one and run
; `peek-display --self-test`'s firmware equivalent before believing the wiring.
; ============================================================================

[platformio]
; The firmware lives in PeekESP/PeekESP.ino (so the Arduino IDE can open it
; directly); main.cpp at the root is a one-line shim that includes it. Keeping
; src_dir at the project root also puts lv_conf.h on the include path, which is
; what LV_CONF_INCLUDE_SIMPLE below expects.
src_dir = .
default_envs = ttgo-t-display

; ----------------------------------------------------------------------------
;  Shared by every panel
; ----------------------------------------------------------------------------
[env]
platform    = espressif32@6.8.1   ; <-- IMPORTANT, see note below
board       = esp32dev
framework   = arduino

build_src_filter = +<main.cpp>

; The config portal (WebServer + DNSServer + the HTML form) pushes the image to
; ~1.11 MB, which is 84% of the default 1.2 MB app partition. Huge APP gives
; 3 MB and drops that to 35%. Set the same scheme in the Arduino IDE under
; Tools -> Partition Scheme.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed  = 921600

; WHY platform IS PINNED TO 6.8.1
; ----------------------------------------------------------------------------
; 6.8.1 is Arduino-ESP32 2.0.17, which is what this project is verified on.
; Later platform releases ship core 3.x (ESP-IDF 5); nothing here is known to
; need 2.x any more now that the WireGuard library is gone, but the move is
; untested, so the pin stays until someone checks it.
; ----------------------------------------------------------------------------

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.0
    bblanchon/ArduinoJson @ ^7.0.0

; Everything that is not the panel. Each env below appends its own driver,
; geometry and pins to this.
build_flags =
    -D USER_SETUP_LOADED=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000
    ; ---------------- LVGL ---------------------------------------------
    ; Look for "lv_conf.h" on the normal include path instead of the default
    ; "../../lv_conf.h" relative include. -I puts the project root (where
    ; lv_conf.h lives) on that path explicitly.
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I $PROJECT_DIR

; ----------------------------------------------------------------------------
;  LilyGO TTGO T-Display - 1.14" 135x240 ST7789
;  The board this project was built on, and the only one it has run on.
; ----------------------------------------------------------------------------
[env:ttgo-t-display]
build_flags =
    ${env.build_flags}
    -D PEEK_PANEL_TTGO_T_DISPLAY=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH

; ----------------------------------------------------------------------------
;  ILI9341 2.4"/2.8" - native 240x320, mounted landscape
; ----------------------------------------------------------------------------
[env:ili9341-320x240]
build_flags =
    ${env.build_flags}
    -D PEEK_PANEL_ILI9341_320X240=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_MISO=19
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH

; Same panel, mounted upright. A separate env rather than a runtime flag
; because PANEL_W and PANEL_H drive the layout arithmetic at compile time.
[env:ili9341-240x320]
build_flags =
    ${env.build_flags}
    -D PEEK_PANEL_ILI9341_240X320=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_MISO=19
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH

; ----------------------------------------------------------------------------
;  ST7789 1.3" 240x240 - the common square module, no CS pin on most of them
; ----------------------------------------------------------------------------
[env:st7789-240x240]
build_flags =
    ${env.build_flags}
    -D PEEK_PANEL_ST7789_240X240=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=-1
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH

; ----------------------------------------------------------------------------
;  ST7789 2.0" 240x320
; ----------------------------------------------------------------------------
[env:st7789-240x320]
build_flags =
    ${env.build_flags}
    -D PEEK_PANEL_ST7789_240X320=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH

; ----------------------------------------------------------------------------
;  GC9A01 1.28" round
;  The framebuffer is square and the glass is not. layout_metrics.h insets
;  every row to the circle's chord at that height so nothing is drawn under
;  the bezel.
; ----------------------------------------------------------------------------
[env:gc9a01-round]
build_flags =
    ${env.build_flags}
    -D PEEK_PANEL_GC9A01_ROUND=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH

; ----------------------------------------------------------------------------
;  ST7735 1.8" 160x128
; ----------------------------------------------------------------------------
[env:st7735-160x128]
build_flags =
    ${env.build_flags}
    -D PEEK_PANEL_ST7735_160X128=1
    -D ST7735_DRIVER=1
    -D ST7735_BLACKTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
