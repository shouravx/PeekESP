; ============================================================================
;  TTGO T-Display (ESP32) — DietPi Tailscale/WireGuard Physical Dashboard
; ============================================================================
[platformio]
; The firmware lives in PeekESP/PeekESP.ino (so the Arduino IDE can open it
; directly); main.cpp at the root is a one-line shim that includes it. Keeping
; src_dir at the project root also puts lv_conf.h on the include path, which is
; what LV_CONF_INCLUDE_SIMPLE below expects.
src_dir = .

[env:ttgo-t-display]
platform    = espressif32@6.8.1   ; <-- IMPORTANT, see note below
board       = esp32dev
framework   = arduino

build_src_filter = +<main.cpp>

; The config portal (WebServer + DNSServer + the HTML form) pushes the image to
; ~1.11 MB, which is 84% of the default 1.2 MB app partition. Huge APP gives
; 3 MB and drops that to 35%. Set the same scheme in the Arduino IDE under
; Tools -> Partition Scheme.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed  = 921600

; ----------------------------------------------------------------------------
; WHY platform IS PINNED TO 6.8.1
; ----------------------------------------------------------------------------
; platform-espressif32 >= 7.x ships Arduino-ESP32 core 3.x, which is built on
; ESP-IDF 5. The ciniml/WireGuard-ESP32 library still calls the legacy
; `tcpip_adapter` API that was removed in IDF5, so it fails to compile there
; ("tcpip_adapter.h: No such file or directory"). Version 6.8.1 is the last
; 6.x release (Arduino-ESP32 2.0.17 / IDF 4.4), which the library was written
; and tested against. Everything else in this project (TFT_eSPI, LVGL,
; ArduinoJson) is fully happy on this older core too.
;
; If you'd rather stay on the latest core, swap the WireGuard library for the
; ESPHome-derived "esp_wireguard" port (droscy/esp_wireguard, used via the
; `pioarduino` platform fork) — different API, not a drop-in replacement.
; ----------------------------------------------------------------------------

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.0
    ciniml/WireGuard-ESP32 @ ^0.1.5
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    ; ---------------- TFT_eSPI: TTGO T-Display 1.14" 135x240 ST7789 --------
    ; Configuring the driver via build flags means you never touch
    ; User_Setup.h inside the library (which gets overwritten on every
    ; `pio lib update`).
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000

    ; ---------------- LVGL ---------------------------------------------
    ; Look for "lv_conf.h" on the normal include path instead of the default
    ; "../../lv_conf.h" relative include. -I puts the project root (where
    ; lv_conf.h lives) on that path explicitly.
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I $PROJECT_DIR
