name: Release

# Tag-triggered, and the release it creates is a DRAFT. A published release is
# a public artefact with a URL that people and tools hold on to, and
# un-publishing one after the fact does not fully work - so the last step is a
# person clicking publish, not a push.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to the VERSION file)"
        required: false

permissions:
  contents: write

jobs:
  linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The version has to agree with itself
        run: python tools/bump_version.py --check

      # The agent is standard library only, so "does it run" is a real check
      # rather than a smoke test of the packaging around it.
      - name: The agent reads this machine
        run: |
          out=$(python3 dietpi/peek-agent.py --once)
          echo "$out"
          echo "$out" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          need = ['host','cpu_percent','ram_percent','storage_percent',
                  'storage_total_gb','cpu_temp_c','battery_percent','uptime_seconds']
          missing = [k for k in need if k not in d]
          if missing:
              raise SystemExit('missing fields: ' + ', '.join(missing))
          print('all fields present')
          "

      - name: Build the .deb
        run: sh packaging/build-deb.sh

      # dpkg will happily produce a package that installs and then does
      # nothing. Installing it is the only way to find out that a path in the
      # control file was wrong.
      - name: Install it, and check what it shipped
        run: |
          sudo apt-get install -y ./dist/peekesp_*_all.deb
          peekesp version
          test -x /usr/lib/peekesp/peek-agent.py
          test -f /lib/systemd/system/peek-agent.service
          # No pairing code, on purpose - a package carrying one would put a
          # credential in every user's filesystem.
          sudo grep -q '^PEEK_PAIR_CODE=$' /etc/peekesp/agent.conf
          echo "installs clean, and ships no secret"
          sudo apt-get remove -y peekesp

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.deb

  windows:
    name: Windows app
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The version has to agree with itself
        run: python tools/bump_version.py --check

      - name: Check the tag matches the VERSION file
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $file = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne $file) {
            # These drift silently otherwise, and the result is a release whose
            # assets are named for one version while the manifests point at
            # another - which only shows up as a 404 during winget review.
            Write-Error "tag v$tag does not match VERSION ($file)"
            exit 1
          }
          Write-Output "version $file"

      - name: Build and package
        shell: pwsh
        run: |
          cd windows
          python package.py

      - name: Smoke-test the headless agent
        shell: pwsh
        run: |
          # A build that succeeds is not evidence the binary works: excluding a
          # module PyInstaller thought was unused once built cleanly here and
          # died at launch. Run it before anyone can download it.
          $out = & windows\dist\peek-agent.exe --once | Out-String
          Write-Output $out
          $json = $out | ConvertFrom-Json
          foreach ($k in 'host','cpu_percent','ram_percent','storage_percent','cpu_temp_c') {
            if ($null -eq $json.$k) { Write-Error "missing field: $k"; exit 1 }
          }
          Write-Output "agent reports $($json.storage_total_gb) GB storage, temp $($json.cpu_temp_c)"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            windows/dist/*.zip
            windows/dist/*.sha256
            packaging/winget/*/*.yaml

      - name: Bring in the Linux package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: windows/dist

      - name: Collect the manifests that match THIS build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # The manifests committed to the repository were generated beside a
          # zip built on someone's laptop. A PyInstaller exe is not
          # reproducible - it embeds build paths and timestamps - so the zip
          # built here has a different hash, and the committed manifest does
          # not describe it. The ones that do are the ones package.py just
          # wrote, so they travel with the release rather than being left
          # behind in the workspace.
          $v = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force -Path release-manifests | Out-Null
          Copy-Item "packaging/winget/$v/*.yaml" release-manifests/
          Compress-Archive -Path release-manifests/* `
            -DestinationPath "windows/dist/winget-manifests-$v.zip" -Force
          Get-ChildItem release-manifests | ForEach-Object { Write-Output $_.Name }

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh, not a marketplace action: it is preinstalled on the runner, it
          # authenticates with the token this job already has, and it is one
          # less third party with write access to the release.
          $v = (Get-Content VERSION -Raw).Trim()

          # Named, not counted. The bare executables are here because winget is
          # not the only way people get this: the zip is what winget installs,
          # and someone who just wants the tray app should not have to download
          # 27 MB and unpack it to reach one file.
          $expected = [ordered]@{
            "app zip"       = "windows/dist/PeekESP-$v-win-x64.zip"
            "app checksum"  = "windows/dist/PeekESP-$v-win-x64.zip.sha256"
            "manifests"     = "windows/dist/winget-manifests-$v.zip"
            "linux package" = "windows/dist/peekesp_${v}_all.deb"
            "tray app"      = "windows/dist/PeekESP.exe"
            "headless agent"= "windows/dist/peek-agent.exe"
            "firmware"      = "firmware/PeekESP-merged.bin"
          }

          $files = @()
          $missing = @()
          foreach ($k in $expected.Keys) {
            if (Test-Path $expected[$k]) {
              $files += (Resolve-Path $expected[$k]).Path
              Write-Output "attaching  $k -> $($expected[$k])"
            } else {
              $missing += "$k ($($expected[$k]))"
            }
          }
          # A release quietly missing an asset is worse than a failed build,
          # because it looks finished. Naming them says which one went astray.
          if ($missing.Count) {
            Write-Error ("missing assets: " + ($missing -join ", "))
            exit 1
          }

          # Idempotent: re-running against a tag whose release already exists
          # replaces the assets instead of failing, so a bad release can be
          # rebuilt without deleting anything by hand.
          $exists = $false
          gh release view "${{ github.ref_name }}" > $null 2>&1
          if ($LASTEXITCODE -eq 0) { $exists = $true }

          if ($exists) {
            Write-Output "release exists - replacing its assets"
            gh release upload "${{ github.ref_name }}" $files --clobber
          } else {
            gh release create "${{ github.ref_name }}" $files `
              --draft `
              --title "PeekESP ${{ github.ref_name }}" `
              --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: What happens next
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Write-Output @"
          The release is a DRAFT. Nothing is public yet.

            1. Check the assets on the Releases page, then publish it.
            2. Confirm the zip URL serves the file.
            3. winget validate --manifest packaging\winget\<version>
               winget install  --manifest packaging\winget\<version>
            4. Submit to microsoft/winget-pkgs - see packaging/winget/README.md

          The exes are unsigned. See windows/SIGNING.md for what that costs
          and what it would take to change.
          "@
